name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout paks
        uses: actions/checkout@v4
        with:
          path: opencode/git/paks
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: opencode/git/paks/plexd/go.mod
          cache-dependency-path: opencode/git/paks/plexd/go.sum

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bin
          key: ffmpeg-tg5040-${{ hashFiles('opencode/git/paks/scripts/build-ffmpeg.sh') }}

      - name: Pull toolchain image
        run: docker pull ghcr.io/loveretro/tg5040-toolchain:latest

      # UI, libmsettings, ffmpeg and plexd, packaged as PlexMusic.pak.zip
      - name: Build and package
        env:
          FFMPEG_CACHE: ${{ github.workspace }}/build/ffmpeg-bin
        run: sh opencode/git/paks/scripts/build-pak.sh "$VERSION"

      - name: Bump pak.json version in repo
        run: |
          jq --arg v "$VERSION" '.version = $v' opencode/git/paks/pak.json > tmp.json \
            && mv tmp.json opencode/git/paks/pak.json
          cd opencode/git/paks
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pak.json
          git diff --staged --quiet || git commit -m "Bump PlexMusic version to $VERSION"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          [ "${{ github.event.inputs.prerelease }}" = "true" ] && PRERELEASE_FLAG="--prerelease"

          # Collect commits since previous tag (fall back to full log on first release)
          PREV_TAG=$(git -C opencode/git/paks describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git -C opencode/git/paks log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges > release_notes.txt
          else
            git -C opencode/git/paks log --pretty=format:"- %s" --no-merges > release_notes.txt
          fi

          gh release create "$VERSION" \
            --title "PlexMusic $VERSION" \
            $PRERELEASE_FLAG \
            --notes-file release_notes.txt \
            "PlexMusic.pak.zip" "PlexMusic-install.zip"
